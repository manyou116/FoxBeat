name: Desktop build

# Version tags publish signed OTA artifacts after all platform builds pass.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: foxbeat-windows-x64
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: foxbeat-macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: foxbeat-macos-x64
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '13.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91.1'
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Test frontend logic
        run: npm test

      - name: Test release manifest generation
        run: npm run test:release

      - name: Check and build frontend
        run: npm run build

      - name: Test native logic
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build desktop package
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Updater signing key is required for release tags'; exit 1; }
            npm run bundle -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' \
              --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npm run bundle -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}'
          fi

      # upload-artifact does not retain Unix permissions. Tar preserves the app bundle.
      - name: Archive macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle='src-tauri/target/${{ matrix.target }}/release/bundle/macos'
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            COPYFILE_DISABLE=1 tar -czf "$bundle/FoxBeat.app.tar.gz" -C "$bundle" FoxBeat.app
          fi

      - name: Verify macOS application and packaged signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node scripts/verify-macos-package.mjs 'src-tauri/target/${{ matrix.target }}/release/bundle' \
            --require-updater --require-dmg

      - name: Test signed macOS OTA installation
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          FOXBEAT_MACOS_UPDATER_ARCHIVE: ${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release/bundle/macos/FoxBeat.app.tar.gz
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target '${{ matrix.target }}' --test macos_updater -- --ignored

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish preview release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq -e --arg version "$version" '.version == $version' package.json
          jq -e --arg version "$version" '.version == $version' src-tauri/tauri.conf.json
          python3 -c 'import sys, tomllib; assert tomllib.load(open("src-tauri/Cargo.toml", "rb"))["package"]["version"] == sys.argv[1]' "$version"

      - uses: actions/download-artifact@v4
        with:
          name: foxbeat-windows-x64
          path: artifacts/windows-x64

      - uses: actions/download-artifact@v4
        with:
          name: foxbeat-macos-arm64
          path: artifacts/macos-arm64

      - uses: actions/download-artifact@v4
        with:
          name: foxbeat-macos-x64
          path: artifacts/macos-x64

      - name: Prepare release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json body --jq .body > release-notes.txt; then
            :
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body > release-notes.txt
          fi
          node scripts/prepare-release.mjs artifacts release-assets "$GITHUB_REF_NAME" release-notes.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "FoxBeat $GITHUB_REF_NAME" \
              --generate-notes \
              --notes '开发预览版。更新包带 OTA 签名；macOS 应用带完整 ad-hoc 签名，但尚无 Developer ID 签名及 Apple 公证，首次安装仍可能被系统拦截。Windows 程序尚无系统代码签名。'
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
