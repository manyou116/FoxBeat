[package]
name = "foxbeat"
version = "0.1.5"
description = "FoxBeat desktop dance companion"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "=2.6.0"
tauri-plugin-single-instance = "=2.5.0"
tauri-plugin-updater = "=2.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "=0.25.0"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "=2.12.0", features = ["test"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
